name: Azure Plan and Drift

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  plan:
    # Never give Azure/state access to fork PRs or Dependabot.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    name: Azure plan - ${{ matrix.stack }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.event_name == 'pull_request' && 'development-plan' || 'development-drift' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        stack: [foundation, integrated]
    concurrency:
      group: azure-development-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_ACCOUNT: ${{ secrets.TFSTATE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ secrets.TFSTATE_CONTAINER }}
      TFSTATE_EXPECTED_LINEAGE: ${{ matrix.stack == 'foundation' && secrets.TFSTATE_LINEAGE_FOUNDATION || secrets.TFSTATE_LINEAGE_INTEGRATED }}
    steps:
      - name: Check out proposed configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Plan against Azure using OIDC
        id: plan
        run: python3 scripts/ci_azure_plan.py --stack "${{ matrix.stack }}" --output "$RUNNER_TEMP/plan-${{ matrix.stack }}.json"
      - name: Publish redacted counts to the PR
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/comment_azure_plan.py "$RUNNER_TEMP/plan-${{ matrix.stack }}.json"
      - name: Retain only redacted summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azure-plan-${{ matrix.stack }}
          path: ${{ runner.temp }}/plan-${{ matrix.stack }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail drift monitoring on pending changes
        if: github.event_name != 'pull_request' && steps.plan.outputs.plan_exit_code == '2'
        run: |
          echo 'Azure differs from the desired configuration. Review the redacted summary; no apply was performed.'
          exit 1
