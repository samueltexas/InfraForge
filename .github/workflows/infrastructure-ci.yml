name: InfraForge Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infraforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

  terraform-validation:
    name: Terraform - ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - target: modules/compute
            run_tests: true
          - target: modules/identity
            run_tests: true
          - target: modules/keyvault
            run_tests: true
          - target: modules/monitoring
            run_tests: true
          - target: modules/networking
            run_tests: true
          - target: modules/resource-group
            run_tests: true
          - target: modules/storage
            run_tests: true
          - target: examples/networking
            run_tests: false
          - target: examples/identity
            run_tests: false
          - target: examples/keyvault
            run_tests: false
          - target: examples/monitoring
            run_tests: false
          - target: examples/integrated
            run_tests: false
          - target: examples/developer-workload
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Initialize Terraform configuration
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: ${{ matrix.target }}
        run: terraform validate -no-color

      - name: Run native Terraform tests
        if: matrix.run_tests
        working-directory: ${{ matrix.target }}
        run: terraform test -no-color

  python-opa-validation:
    name: Python Regression and OPA Policies
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned Python dependencies
        run: |
          python -m pip install \
            python-hcl2==7.3.1 \
            PyYAML==6.0.3

      - name: Run complete Python regression suite
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v

      - name: Validate network policy fixtures
        run: python scripts/test_network_policies.py

      - name: Generate Terraform-derived network policy input
        run: |
          python scripts/validate_terraform_network.py \
            --output "$RUNNER_TEMP/terraform-generated.json"

      - name: Validate generated JSON
        run: |
          python -m json.tool \
            "$RUNNER_TEMP/terraform-generated.json" \
            > /dev/null

      - name: Enforce OPA policies on Terraform-derived configuration
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP:/input:ro" \
            -v "$GITHUB_WORKSPACE/policies/network:/policy:ro" \
            openpolicyagent/conftest@sha256:a4a4dd6cfd541cd34ff2291b3198928cd6aff75aa761901b27e66bd36faf6925 \
            test /input/terraform-generated.json \
            --policy /policy

  checkov-security:
    name: Checkov Infrastructure Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: python -m pip install checkov==3.4.5

      - name: Scan Terraform infrastructure
        run: |
          checkov \
            -d . \
            --framework terraform \
            --download-external-modules false \
            --skip-path .backups \
            --skip-path .git \
            --skip-path .terraform \
            --compact

  tflint-validation:
    name: TFLint - ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        target:
          - modules/compute
          - modules/identity
          - modules/keyvault
          - modules/monitoring
          - modules/networking
          - modules/resource-group
          - modules/storage
          - examples/networking
          - examples/identity
          - examples/keyvault
          - examples/monitoring
          - examples/integrated
          - examples/developer-workload

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.59.1

      - name: Initialize TFLint plugins
        run: tflint --init

      - name: Run TFLint
        run: tflint --chdir="${{ matrix.target }}" --config="$GITHUB_WORKSPACE/.tflint.hcl"
