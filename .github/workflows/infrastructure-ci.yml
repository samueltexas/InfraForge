name: Infrastructure Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: examples/networking
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: examples/networking
        run: terraform validate -no-color

  security-scanning:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: python -m pip install checkov==3.4.5

      - name: Scan Terraform infrastructure
        run: |
          checkov             -d .             --framework terraform             --download-external-modules false             --compact             --quiet
