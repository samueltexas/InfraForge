name: Infrastructure Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: examples/networking
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: examples/networking
        run: terraform validate -no-color

      - name: Initialize IAM Terraform example
        working-directory: examples/identity
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate IAM Terraform example
        working-directory: examples/identity
        run: terraform validate -no-color

      - name: Initialize Key Vault Terraform example
        working-directory: examples/keyvault
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Key Vault Terraform example
        working-directory: examples/keyvault
        run: terraform validate -no-color

      - name: Initialize Monitoring Terraform example
        working-directory: examples/monitoring
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Monitoring Terraform example
        working-directory: examples/monitoring
        run: terraform validate -no-color

      - name: Initialize Integrated Architecture
        working-directory: examples/integrated
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Integrated Architecture
        working-directory: examples/integrated
        run: terraform validate -no-color

  security-scanning:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: python -m pip install checkov==3.4.5

      - name: Scan Terraform infrastructure
        run: |
          checkov             -d .             --framework terraform             --download-external-modules false             --compact             --quiet

  tflint-validation:
    name: TFLint Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1

      - name: Initialize TFLint
        run: tflint --init

      - name: Lint networking module
        run: tflint --chdir=modules/networking

      - name: Lint networking example
        run: tflint --chdir=examples/networking

      - name: Lint identity module
        run: tflint --chdir=modules/identity

      - name: Lint identity example
        run: tflint --chdir=examples/identity
      - name: Lint Key Vault module
        run: tflint --chdir=modules/keyvault

      - name: Lint Key Vault example
        run: tflint --chdir=examples/keyvault

      - name: Lint Monitoring module
        run: tflint --chdir=modules/monitoring

      - name: Lint Monitoring example
        run: tflint --chdir=examples/monitoring

  policy-validation:
    name: OPA Network Policy Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify network security policies
        run: python3 scripts/test_network_policies.py

  terraform-policy-enforcement:
    name: Terraform Configuration Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HCL parser
        run: python -m pip install python-hcl2==7.3.1

      - name: Run infrastructure security regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Terraform network configuration
        run: python scripts/validate_terraform_network.py

      - name: Enforce OPA policies on Terraform-derived rules
        run: |
          docker run --rm \
            -v "$PWD:/project:ro" \
            -w /project \
            openpolicyagent/conftest:v0.59.0 \
            test tests/policies/network/terraform-generated.json \
            --policy policies/network

  identity-security:
    name: Azure IAM Security Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Initialize IAM module
        working-directory: modules/identity
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Run IAM security tests
        working-directory: modules/identity
        run: terraform test -no-color

  keyvault-security:
    name: Azure Key Vault Security Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Initialize Key Vault module
        working-directory: modules/keyvault
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Run Key Vault security tests
        working-directory: modules/keyvault
        run: terraform test -no-color

  monitoring-security:
    name: Azure Monitoring Security Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Initialize Monitoring module
        working-directory: modules/monitoring
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Monitoring module
        working-directory: modules/monitoring
        run: terraform validate -no-color

      - name: Run Monitoring security tests
        working-directory: modules/monitoring
        run: terraform test -no-color

  infrastructure-reliability:
    name: Infrastructure Reliability Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install python-hcl2==7.3.1 PyYAML

      - name: Run complete infrastructure test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
